name: CI

on:
  push:
    branches: [main, 'feature/**', 'cleaned-MVP-1']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer update --no-interaction --prefer-dist --no-progress
      - uses: actions/upload-artifact@v4
        with:
          name: composer-lockfile-bootstrap
          path: composer.lock
          if-no-files-found: error
          retention-days: 1
      - run: cp .env.example .env
      - run: composer test
      - run: composer lint

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-bootstrap
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npm run lint
      - run: npm run build
