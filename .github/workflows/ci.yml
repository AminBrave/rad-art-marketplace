name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend unit, feature, integration, coverage and PHP style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: pcov
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Prepare backend test report directory
        run: mkdir -p build/test-reports
      - name: Run unit tests and collect line coverage
        run: vendor/bin/phpunit --testsuite=Unit --coverage-clover=build/test-reports/backend-unit-clover.xml --log-junit=build/test-reports/backend-unit-junit.xml
      - name: Run feature tests and collect line coverage
        run: vendor/bin/phpunit --testsuite=Feature --coverage-clover=build/test-reports/backend-feature-clover.xml --log-junit=build/test-reports/backend-feature-junit.xml
      - name: Run integration tests and collect line coverage
        run: vendor/bin/phpunit --testsuite=Integration --coverage-clover=build/test-reports/backend-integration-clover.xml --log-junit=build/test-reports/backend-integration-junit.xml
      - run: composer lint
      - name: Upload backend test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-and-coverage-reports
          path: build/test-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend unit tests, lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Prepare frontend test report directory
        run: mkdir -p build/test-reports
      - name: Run frontend tests with JUnit output
        run: node --test --test-reporter=junit --test-reporter-destination=build/test-reports/frontend-junit.xml tests/js/*.test.js
      - run: npm run lint
      - run: npm run build
      - name: Upload frontend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: build/test-reports/frontend-junit.xml
          if-no-files-found: ignore
          retention-days: 14

  browser-e2e:
    name: Playwright browser and full-stack E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Prepare isolated SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite
          echo "DB_CONNECTION=sqlite" >> "$GITHUB_ENV"
          echo "DB_DATABASE=$GITHUB_WORKSPACE/database/database.sqlite" >> "$GITHUB_ENV"
      - run: php artisan migrate --force
      - name: Seed isolated browser-test actors and sample data
        run: php artisan db:seed --class=DemoDatabaseSeeder --force
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Start Laravel application
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/rad-art-laravel.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/rad-art-laravel.log
          exit 1
      - name: Run browser regressions and full-stack E2E
        env:
          RAD_ART_BASE_URL: http://127.0.0.1:8000
        run: python tests/browser/run_tests.py
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: build/test-reports/browser-junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Laravel log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-e2e-log
          path: /tmp/rad-art-laravel.log
          if-no-files-found: ignore
