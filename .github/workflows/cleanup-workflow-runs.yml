name: Clean workflow runs

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: clean-workflow-runs
  cancel-in-progress: false

jobs:
  clean:
    name: Delete completed runs older than 14 days
    runs-on: ubuntu-latest
    steps:
      - name: Clean old workflow runs
        uses: igorjs/gh-actions-clean-workflow@v8
        with:
          runs_older_than: 14
          runs_to_keep: 20
