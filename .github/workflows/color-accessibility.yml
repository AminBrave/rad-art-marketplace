name: RAD accessibility and regression checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify RAD color contrast tokens
        run: npm run a11y:colors
      - name: Build and audit compiled Vite color utilities
        run: npm run a11y:build
      - name: Run frontend regression tests
        run: npm run test:frontend
      - name: Lint the complete frontend
        run: npm run lint
      - name: Build the production frontend
        run: npm run production

  backend-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, xml, curl, zip
          coverage: none
      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run Laravel feature and unit tests
        run: php artisan test
      - name: Verify PHP formatting for changed files
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          mapfile -t php_files < <(git diff --name-only "origin/${base_ref}...HEAD" -- '*.php')
          if (( ${#php_files[@]} == 0 )); then
            echo "No changed PHP files to format-check."
            exit 0
          fi
          vendor/bin/pint --test "${php_files[@]}"
