name: Frontend quality

on:
  push:
    branches: [main]
    paths:
      - 'resources/js/**'
      - 'AI/**'
      - 'AGENTS.md'
      - 'resources/css/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tailwind.config.js'
      - 'vite.config.js'
      - 'scripts/check-frontend-architecture.mjs'
      - '.github/workflows/frontend-quality.yml'
      - '.agents/skills/**'
      - 'scripts/check-skills.mjs'
      - 'AI/**'
      - 'AGENTS.md'
  pull_request:
    branches: [main]
    paths:
      - 'resources/js/**'
      - 'resources/css/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tailwind.config.js'
      - 'vite.config.js'
      - 'scripts/check-frontend-architecture.mjs'
      - '.github/workflows/frontend-quality.yml'
      - '.agents/skills/**'
      - 'scripts/check-skills.mjs'
      - 'AI/**'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run architecture, lint and production-build checks
        run: npm run quality:frontend && npm run skills:check
